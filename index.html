</style></head><body><header class="app-header"><div class="header-inner"><h1>lo-tools.be <small>· rubrics</small></h1><nav class="header-nav" aria-label="Modules"><button id="navDesign" class="active" onclick="show('design')">Rubricontwerper</button><button id="navStudents" onclick="show('students')">Leerlingen</button><button id="navEval" onclick="show('eval')">Evalueren</button><button id="navFiles" onclick="show('files')">Bestanden</button></nav></div></header><main><div id="design"><section><div class="design-topline"><div id="rubricSelector" class="design-rubric-bar"><div id="designTabs" class="rubric-tabs" role="tablist" aria-label="Rubrics bewerken"></div></div><div id="designSettings" class="settings-panel hidden"><div class="settings-grid"><button onclick="newRubric()">Rubric toevoegen</button><button onclick="deleteRubric()">Rubric verwijderen</button><button onclick="document.getElementById('rubricFile').click()">Rubrics importeren</button><button onclick="exportRubrics()">Rubrics exporteren</button><button onclick="printRubric()">Rubric afdrukken</button><button type="button" id="excelInfoBtn" aria-haspopup="dialog" onclick="openRubricInfo()">Info</button></div><div id="designEditActions" class="settings-grid design-edit-actions"><button onclick="renameCurrentRubric()">Naam wijzigen</button><button onclick="openScoreSettings()">Score-instellingen</button><button type="button" id="autoScoreToggle" class="hidden" aria-pressed="false" onclick="toggleAutoScoreVisibility()">✓ Automatische scores: tonen ▾</button><button type="button" id="manualScoreToggle" class="hidden" onclick="openScoreSettings()">✓ Handmatige scores</button><button onclick="openCountPicker('criteria')">Criteria</button><button onclick="openCountPicker('levels')">Niveaus</button></div></div><button type="button" id="designSettingsButton" aria-expanded="false" aria-controls="designSettings" onclick="toggleDesignSettings()">Meer opties ▾</button><input class="hidden" id="rubricFile" type="file" accept=".xlsx,.xls" onchange="importRubrics(event)"></div><div id="editor"></div></section></div><div id="eval" class="hidden"><section class="eval-section">
<div class="eval-toolbar"><div class="rubric-bar"><div id="evalTabs" class="rubric-tabs" role="tablist" aria-label="Rubrics"></div></div></div>
<div id="evaluation"></div><input id="photoPdfFile" class="hidden" type="file" accept=".pdf,application/pdf" onchange="loadPhotoPdf(event)"></section></div><div id="students" class="hidden"><section><div class="student-topline"><span></span><div id="studentActions" class="module-actions student-toolbar hidden"><button onclick="document.getElementById('classFile').click()">Klaslijst importeren</button><button onclick="openPhotoImporter()">Fotolijst importeren</button><button onclick="addStudent()">Leerling toevoegen</button><button onclick="openGroups()">Groepen</button><label class="student-name-select"><span class="sr-only">Naamweergave</span><select id="studentNameOrder" aria-label="Naamweergave" onchange="setNameOrder(this.value)"><option value="first">Voornaam – achternaam</option><option value="last">Achternaam – voornaam</option></select></label></div><button type="button" id="studentOptionsButton" aria-expanded="false" aria-controls="studentActions" onclick="toggleStudentOptions()">Meer opties ▾</button></div><div id="studentManager"></div></section></div><div id="files" class="hidden"><section><div class="module-heading"><h2>Bestanden</h2></div><div class="files-panel"><label>Sessienaam <button type="button" id="sessionTitle" onclick="openSessionNameDialog()">Sessienaam instellen</button></label><label>Datum <input aria-label="Datum" id="sessionDate" type="date" onchange="state.date=this.value"></label><div class="module-actions"><button onclick="exportSession()">Sessie bewaren</button><button onclick="document.getElementById('sessionFile').click()">Sessie hervatten</button><button onclick="exportResults()">Resultaten exporteren</button></div></div></section></div><input id="classFile" class="hidden" type="file" accept=".xlsx,.xls" onchange="importClass(event)"><input id="sessionFile" class="hidden" type="file" accept=".xlsx" onchange="importSession(event)"></main><div id="print" class="rubricprint"></div><div id="toast"></div><div id="bulkModal" class="hidden"></div><div id="photoModal" class="hidden"></div><div id="photoPopover" class="hidden"></div><div id="groupModal" class="hidden"></div><div id="undoBar" class="hidden"></div><div id="evalInfoModal" class="hidden"></div><div id="rubricInfoModal" class="hidden"></div><div id="scorePickerModal" class="hidden"></div><div id="scoreModal" class="hidden"></div><div id="rubricNameModal" class="hidden"></div><div id="sessionNameModal" class="hidden"></div><div id="countModal" class="hidden"></div><div id="studentEditModal" class="hidden"></div><script>
const blank=()=>({scoreMode:'none',pointValues:[],manualScores:{},maxScore:20,id:crypto.randomUUID(),name:'Nieuwe rubric',criteria:['Criterium 1','Criterium 2'],levels:['Niveau 4','Niveau 3','Niveau 2','Niveau 1'],descriptions:Array.from({length:4},()=>['',''])});
let editorRubricId='';
const visibleAutoScores=new Set();
let state={rubrics:[],students:[],studentNameParts:{},studentNameOrder:'first',studentOrder:[],scores:{},sessionName:'',date:new Date().toISOString().slice(0,10),activeRubric:'',groups:[],studentGroups:{},photos:{},absent:[]};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2700)}
function show(tab){for(const name of ['design','students','eval','files']){$(name).classList.toggle('hidden',tab!==name);$('nav'+({design:'Design',students:'Students',eval:'Eval',files:'Files'}[name])).classList.toggle('active',tab===name)}renderAll()}
function chosen(){return state.rubrics.find(r=>r.id===editorRubricId)||state.rubrics[0]}
function ensurePoints(r){if(!r.pointValues)r.pointValues=[];if(!r.manualScores)r.manualScores={};if(!r.scoreMode)r.scoreMode='none';if(!Number.isInteger(Number(r.maxScore))||Number(r.maxScore)<1)r.maxScore=20;r.criteria.forEach((_,j)=>{if(!r.pointValues[j])r.pointValues[j]=[];r.levels.forEach((_,n)=>{if(r.pointValues[j][n]===undefined)r.pointValues[j][n]=r.levels.length-1-n})})}
function openScoreSettings(){const r=chosen();if(!r)return;ensurePoints(r);renderScoreSettings();$('scoreModal').classList.remove('hidden')}
function closeScoreSettings(showAutomatic=false){const r=chosen();if(showAutomatic&&r?.scoreMode==='auto')visibleAutoScores.add(r.id);$('scoreModal').classList.add('hidden');$('scoreModal').innerHTML='';renderAll()}
function setScoreMode(mode){const r=chosen();ensurePoints(r);r.scoreMode=mode;renderScoreSettings();renderEval()}
function setPointValue(j,n,v){const r=chosen();ensurePoints(r);r.pointValues[j][n]=v===''?'':Number(v);renderEval()}
function setMaxScore(v){const r=chosen();if(!r)return;const max=Math.max(1,Math.min(100,Math.round(Number(v)||20)));r.maxScore=max;Object.keys(r.manualScores||{}).forEach(k=>{if(Number(r.manualScores[k])>max)delete r.manualScores[k]});renderScoreSettings();renderEval()}
function openManualPicker(rid,i,event){const r=state.rubrics.find(x=>x.id===rid);if(!r)return;ensurePoints(r);const max=r.maxScore;const existing=r.manualScores[i];const modal=$('scorePickerModal');modal.innerHTML=`<div class="score-picker-backdrop" onclick="if(event.target===this)closeManualPicker()"><div class="score-picker" role="dialog" aria-modal="true" aria-label="Totaalscore kiezen"><div class="bulk-head"><h3>Kies een score /${max}</h3><button onclick="closeManualPicker()" aria-label="Sluiten">×</button></div><div class="score-picker-grid">${Array.from({length:max+1},(_,j)=>max-j).map(n=>`<button class="${existing===n?'chosen':''}" onclick="chooseManualScore('${rid}',${i},${n})">${n}</button>`).join('')}</div><button class="score-clear" onclick="chooseManualScore('${rid}',${i},null)">Score wissen</button></div></div>`;modal.classList.remove('hidden');const rect=event?.currentTarget?.getBoundingClientRect();const picker=modal.querySelector('.score-picker');if(rect&&window.innerWidth>=700){picker.style.position='fixed';picker.style.left=Math.max(12,Math.min(rect.left,window.innerWidth-332))+'px';picker.style.top=Math.max(12,Math.min(rect.bottom+7,window.innerHeight-Math.min(480,picker.scrollHeight)-12))+'px'}}
function closeManualPicker(){$('scorePickerModal').classList.add('hidden');$('scorePickerModal').innerHTML=''}
function chooseManualScore(rid,i,n){setManualScore(rid,i,n===null?'':n);closeManualPicker();renderEval()}
function setManualScore(rid,i,v){const r=state.rubrics.find(x=>x.id===rid);if(!r)return;ensurePoints(r);if(v==='')delete r.manualScores[i];else r.manualScores[i]=Number(v)}
function totalScore(r,i){ensurePoints(r);let sum=0,any=false;r.criteria.forEach((_,j)=>{const n=state.scores[key(r.id,i,j)];if(n!==undefined){any=true;sum+=Number(r.pointValues[j]?.[n])||0}});return any?String(Math.round(sum*100)/100):'—'}
function renderScoreSettings(){const r=chosen();ensurePoints(r);const mode=r.scoreMode;const modal=$('scoreModal');modal.innerHTML=`<div class="bulk-backdrop" onclick="if(event.target===this)closeScoreSettings()"><div class="bulk-dialog score-dialog" role="dialog" aria-modal="true" aria-label="Score-instellingen"><div class="bulk-head"><h3>Score-instellingen</h3><button onclick="closeScoreSettings()" aria-label="Sluiten">×</button></div><div class="score-modes"><label><input type="radio" name="scoreMode" value="none" ${mode==='none'?'checked':''} onchange="setScoreMode('none')"> Geen totaalscore</label><label><input type="radio" name="scoreMode" value="auto" ${mode==='auto'?'checked':''} onchange="setScoreMode('auto')"> Automatisch berekenen</label><label><input type="radio" name="scoreMode" value="manual" ${mode==='manual'?'checked':''} onchange="setScoreMode('manual')"> Handmatig invoeren</label></div>${mode==='auto'?'<p class="score-note">Pas de punten aan in de rubric via ‘Automatische scores: tonen’.</p>':mode==='manual'?`<div class="score-max-setting"><label for="maxScore">Maximumscore</label><input id="maxScore" type="number" min="1" max="100" step="1" value="${r.maxScore}" onchange="setMaxScore(this.value)"><span>punten</span></div>`:''}<div class="score-footer"><button class="primary" onclick="closeScoreSettings(true)">Gereed</button></div></div></div>`}
function toggleAutoScoreVisibility(){const r=chosen();if(!r||r.scoreMode!=='auto')return;if(visibleAutoScores.has(r.id))visibleAutoScores.delete(r.id);else visibleAutoScores.add(r.id);renderAll()}
function adjustAutoPoints(axis,index,delta){const r=chosen();if(!r||r.scoreMode!=='auto')return;ensurePoints(r);for(let j=0;j<r.criteria.length;j++){for(let n=0;n<r.levels.length;n++){if(axis==='cell'&&j!==index[0]||axis==='cell'&&n!==index[1])continue;if(axis==='criterion'&&j!==index||axis==='level'&&n!==index)continue;r.pointValues[j][n]=Math.max(0,(Number(r.pointValues[j][n])||0)+delta)}}const wrap=document.querySelector('#editor .tablewrap');const scrollTop=wrap?.scrollTop??0;const scrollLeft=wrap?.scrollLeft??0;const pageX=window.scrollX,pageY=window.scrollY;renderAll();const updated=document.querySelector('#editor .tablewrap');if(updated){updated.scrollTop=scrollTop;updated.scrollLeft=scrollLeft}window.scrollTo(pageX,pageY)}
function pointControl(axis,index,value,label){const arg=Array.isArray(index)?`[${index.join(',')}]`:index;return `<div class="point-control" aria-label="${esc(label)}"><button type="button" aria-label="${esc(label)} verlagen" onclick="adjustAutoPoints('${axis}',${arg},-1)">−</button><span>${value===null?'±1':esc(value)}</span><button type="button" aria-label="${esc(label)} verhogen" onclick="adjustAutoPoints('${axis}',${arg},1)">+</button></div>`}

function openRubricNameDialog(mode){
 const current=chosen();if(mode==='rename'&&!current)return;
 const modal=$('rubricNameModal');const existing=mode==='rename'?current.name:'';
 modal.innerHTML=`<div class="bulk-backdrop" onclick="if(event.target===this)closeRubricNameDialog()"><div class="bulk-dialog rubric-name-dialog" role="dialog" aria-modal="true" aria-labelledby="rubricNameTitle"><div class="bulk-head"><h3 id="rubricNameTitle">${mode==='rename'?'Naam wijzigen':'Nieuwe rubric'}</h3><button type="button" onclick="closeRubricNameDialog()" aria-label="Sluiten">×</button></div><form onsubmit="saveRubricName(event,'${mode}')"><label for="rubricNameInput">Naam rubric</label><input id="rubricNameInput" type="text" maxlength="100" required value="${esc(existing)}" placeholder="Naam rubric" autocomplete="off"><div class="score-footer"><button type="button" onclick="closeRubricNameDialog()">Annuleren</button><button type="submit" class="primary">${mode==='rename'?'Opslaan':'Aanmaken'}</button></div></form></div></div>`;
 modal.classList.remove('hidden');const input=$('rubricNameInput');input.focus();if(mode==='rename')input.select();
}
function closeRubricNameDialog(){$('rubricNameModal').classList.add('hidden');$('rubricNameModal').innerHTML=''}
function saveRubricName(event,mode){event.preventDefault();const name=$('rubricNameInput').value.trim();if(!name)return; if(mode==='rename'){const r=chosen();if(r)r.name=name;}else{const r=blank();r.name=name;state.rubrics.push(r);if(!state.activeRubric)state.activeRubric=r.id;editorRubricId=r.id;}closeRubricNameDialog();renderAll()}
function newRubric(){openRubricNameDialog('new')}
function renameCurrentRubric(){openRubricNameDialog('rename')}
function deleteRubric(){if(!state.rubrics.length)return;let r=chosen();if(!confirm('Rubric '+r.name+' verwijderen?'))return;state.rubrics=state.rubrics.filter(x=>x.id!==r.id);if(state.activeRubric===r.id)state.activeRubric=state.rubrics[0]?.id||'';if(editorRubricId===r.id)editorRubricId=state.rubrics[0]?.id||'';renderAll()}
function selectDesignRubric(id){editorRubricId=id;renderAll()}
function renderDesignTabs(){const tabs=$('designTabs');tabs.innerHTML=state.rubrics.map(r=>`<button role="tab" aria-selected="${r.id===editorRubricId}" class="rubric-tab ${r.id===editorRubricId?'selected':''}" onclick="selectDesignRubric('${esc(r.id)}')">${esc(r.name)}</button>`).join('')}
function renderAll(){if(!state.rubrics.some(r=>r.id===editorRubricId))editorRubricId=state.rubrics[0]?.id||'';const active=chosen();const auto=active?.scoreMode==='auto';const toggle=$('autoScoreToggle');toggle.classList.toggle('hidden',!auto);if(auto){const visible=visibleAutoScores.has(active.id);toggle.textContent=visible?'✓ Automatische scores: verbergen ▴':'✓ Automatische scores: tonen ▾';toggle.setAttribute('aria-pressed',String(visible));}$('manualScoreToggle').classList.toggle('hidden',active?.scoreMode!=='manual');$('rubricSelector').classList.toggle('hidden',!state.rubrics.length);$('designEditActions').classList.toggle('hidden',!state.rubrics.length);renderDesignTabs();renderSessionTitle();$('sessionDate').value=state.date;renderEditor();renderEval();renderStudents()}
function renderEditor(){
 let r=chosen();
 if(!r){$('editor').innerHTML='<div class="empty-state"><h3>Nog geen rubrics</h3><button class="primary" onclick="newRubric()">Nieuwe rubric maken</button><button onclick="document.getElementById(&quot;rubricFile&quot;).click()">Rubric importeren</button></div>';return;}
 ensurePoints(r);
 const showPoints=r.scoreMode==='auto'&&visibleAutoScores.has(r.id);
 if(showPoints){
  const maxima=r.criteria.map((_,j)=>Math.max(0,...r.pointValues[j].map(v=>Number(v)||0)));
  const total=maxima.reduce((a,b)=>a+b,0);
  $('editor').innerHTML=`<div class="score-matrix-heading"><strong>Puntenverdeling</strong><strong>Maximale totaalscore: ${total} punten</strong></div><div class="tablewrap"><table class="editor score-editor"><thead><tr><th>Criterium</th>${r.levels.map((l,i)=>`<th><div>${esc(l)}</div>${pointControl('level',i,null,'Alle punten voor '+l)}</th>`).join('')}</tr></thead><tbody>${r.criteria.map((c,j)=>`<tr><td><strong>${esc(c)}</strong><div class="criterion-maximum">Max. ${maxima[j]} punten</div>${pointControl('criterion',j,null,'Alle punten voor '+c)}</td>${r.levels.map((l,i)=>`<td>${pointControl('cell',[j,i],r.pointValues[j][i],'Punten '+c+' '+l)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  return;
 }
 $('editor').innerHTML=`<div class="tablewrap"><table class="editor"><thead><tr><th>Criterium</th>${r.levels.map((l,i)=>`<th><input aria-label="Prestatieniveau" value="${esc(l)}" onchange="editLevel(${i},this.value)"></th>`).join('')}</tr></thead><tbody>${r.criteria.map((c,j)=>`<tr><td><input aria-label="Criterium" value="${esc(c)}" onchange="editCriterion(${j},this.value)"><button title="Verwijder criterium" onclick="removeCriterion(${j})">×</button></td>${r.levels.map((l,i)=>`<td><textarea aria-label="Beschrijving ${esc(c)} ${esc(l)}" onchange="editDesc(${i},${j},this.value)">${esc(r.descriptions[i]?.[j]||'')}</textarea></td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function editCriterion(j,v){chosen().criteria[j]=v;renderAll()}
function editLevel(i,v){chosen().levels[i]=v;renderEval()}
function editDesc(i,j,v){chosen().descriptions[i][j]=v}
function openCountPicker(kind){
 const r=chosen();if(!r)return;
 const isCriteria=kind==='criteria',current=isCriteria?r.criteria.length:r.levels.length;
 const min=isCriteria?1:2,max=isCriteria?15:6;
 const title=isCriteria?'Aantal criteria':'Aantal niveaus';
 $('countModal').innerHTML=`<div class="bulk-backdrop" onclick="if(event.target===this)closeCountPicker()"><div class="bulk-dialog count-dialog" role="dialog" aria-modal="true" aria-label="${title}"><div class="bulk-head"><h3>${title}</h3><button onclick="closeCountPicker()" aria-label="Sluiten">×</button></div><div class="count-grid">${Array.from({length:max-min+1},(_,i)=>i+min).map(n=>`<button class="${n===current?'chosen':''}" onclick="setRubricCount('${kind}',${n})">${n}</button>`).join('')}</div><p class="count-note">Bestaande inhoud blijft behouden wanneer je het aantal verhoogt.</p></div></div>`;
 $('countModal').classList.remove('hidden');
}
function closeCountPicker(){$('countModal').classList.add('hidden');$('countModal').innerHTML=''}
function setRubricCount(kind,count){
 const r=chosen();if(!r)return;
 const isCriteria=kind==='criteria',current=isCriteria?r.criteria.length:r.levels.length;
 if(count<current){
  const text=isCriteria?'criteria':'niveaus';
  if(!confirm(`Aantal ${text} verlagen van ${current} naar ${count}? De verwijderde onderdelen en bijbehorende beschrijvingen worden uit de rubric gehaald.`))return;
 }
 if(isCriteria){
  while(r.criteria.length<count)addCriterion(false);
  while(r.criteria.length>count)removeCriterion(r.criteria.length-1,false);
 }else{
  while(r.levels.length<count)addLevel(false);
  while(r.levels.length>count)removeLevel(false);
 }
 closeCountPicker();renderAll();
}
function addCriterion(refresh=true){let r=chosen();r.criteria.push('Nieuw criterium');if(r.pointValues)r.pointValues.push(r.levels.map((_,n)=>r.levels.length-1-n));r.descriptions.forEach(a=>a.push(''));if(refresh)renderAll()}
function removeCriterion(j,refresh=true){let r=chosen();if(r.criteria.length<2)return toast('Minstens één criterium behouden');r.criteria.splice(j,1);if(r.pointValues)r.pointValues.splice(j,1);r.descriptions.forEach(a=>a.splice(j,1));if(refresh)renderAll()}
function addLevel(refresh=true){let r=chosen();if(r.levels.length>=6)return toast('Maximaal zes niveaus');r.levels.push('Niveau '+(r.levels.length+1));if(r.pointValues)r.pointValues.forEach(a=>a.push(0));r.descriptions.push(r.criteria.map(() => ''));if(refresh)renderAll()}
function removeLevel(refresh=true){let r=chosen();if(r.levels.length<=2)return toast('Minstens twee niveaus');r.levels.pop();if(r.pointValues)r.pointValues.forEach(a=>a.pop());r.descriptions.pop();if(refresh)renderAll()}
function readExcel(file){return file.arrayBuffer().then(b=>XLSX.read(b,{type:'array'}))}
function checkXlsx(){if(!window.XLSX){toast('Excel-bibliotheek niet geladen. Controleer internetverbinding.');return false}return true}
async function importRubrics(e){
 if(!checkXlsx()||!e.target.files[0])return;
 try{
  const wb=await readExcel(e.target.files[0]),arr=[],bySheet=new Map();
  let config=null;
  if(wb.SheetNames.includes('_Score-instellingen')){
   const raw=XLSX.utils.sheet_to_json(wb.Sheets['_Score-instellingen'],{header:1,defval:''});
   if(raw[0]?.[0]==='LO_RUBRIC_SCORES_V1')config=raw.slice(1);
  }
  for(const sheet of wb.SheetNames){
   if(sheet==='_Score-instellingen')continue;
   const a=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:''});
   const header=a[0]||[];
   const levelIndices=header.map((v,i)=>i>0&&String(v).trim()?i:-1).filter(i=>i>0);
   const rows=a.slice(1).filter(x=>String(x[0]??'').trim());
   if(!levelIndices.length||!rows.length)continue;
   const r={id:crypto.randomUUID(),name:sheet,criteria:rows.map(x=>String(x[0]).trim()),levels:levelIndices.map(i=>String(header[i]).trim()),descriptions:levelIndices.map(i=>rows.map(row=>String(row[i]??'')))};
   arr.push(r);bySheet.set(sheet,r);
  }
  if(!arr.length)throw Error('Geen geldig tabblad: verwacht niveaus vanaf B1 en criteria vanaf A2');
  if(config)for(const row of config){
   const [sheet,mode,max,j,n,points]=row,r=bySheet.get(String(sheet));
   if(!r)continue;
   ensurePoints(r);
   if(['none','auto','manual'].includes(mode))r.scoreMode=mode;
   if(max!==''&&Number.isInteger(Number(max))&&Number(max)>=1)r.maxScore=Math.min(100,Number(max));
   if(j!==''&&n!==''&&Number.isInteger(Number(j))&&Number.isInteger(Number(n))&&Number(j)>=0&&Number(j)<r.criteria.length&&Number(n)>=0&&Number(n)<r.levels.length){r.pointValues[Number(j)][Number(n)]=points===''?'':Number(points)}
  }
  state.rubrics.push(...arr);editorRubricId=arr[0].id;
  if(!state.activeRubric)state.activeRubric=arr[0].id;
  renderAll();toast(arr.length+' rubric(s) geïmporteerd');
 }catch(err){alert('Import mislukt: '+err.message)}
 e.target.value='';
}
function rubricSheet(r){return [ ['',...r.levels],...r.criteria.map((c,j)=>[c,...r.levels.map((_,i)=>r.descriptions[i]?.[j]||'')]) ]}
function exportRubrics(){
 if(!state.rubrics.length)return toast('Maak of importeer eerst een rubric');
 if(!checkXlsx())return;
 const wb=XLSX.utils.book_new(),config=[['LO_RUBRIC_SCORES_V1','Modus','Maximumscore','CriteriumIndex','NiveauIndex','Punten']];
 state.rubrics.forEach((r,i)=>{
  ensurePoints(r);
  const sheet=uniqueSheetName(wb,r.name||'Rubric '+(i+1));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rubricSheet(r)),sheet);
  config.push([sheet,r.scoreMode,r.maxScore,'','','']);
  r.criteria.forEach((_,j)=>r.levels.forEach((_,n)=>config.push([sheet,'','',j,n,r.pointValues[j][n]])));
 });
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(config),'_Score-instellingen');
 if(!wb.Workbook)wb.Workbook={};if(!wb.Workbook.Sheets)wb.Workbook.Sheets=wb.SheetNames.map(name=>({name}));const sh=wb.Workbook.Sheets.find(x=>x.name==='_Score-instellingen');if(sh)sh.Hidden=1;
 XLSX.writeFile(wb,'LO-rubrics.xlsx');
}
function uniqueSheetName(wb,name){let base=name.replace(/[\\/?*\[\]:]/g,' ').slice(0,27)||'Rubric',n=base,k=2;while(wb.SheetNames.includes(n))n=(base.slice(0,25)+' '+k++).slice(0,31);return n}

function renderEval(){

 if(!hasGroups)evaluationView='students';
 const groupMode=hasGroups&&evaluationView==='groups';
 const rows=groupMode?state.groups.filter(g=>present.some(x=>state.studentGroups[x.i]===g.id)).sort((a,b)=>Number(expandedEvalGroups.has(b.id))-Number(expandedEvalGroups.has(a.id))).flatMap(g=>{
  const groupRow={name:g.name,group:g,groupRow:true};
  if(!expandedEvalGroups.has(g.id))return [groupRow];

 }):present.map(({name,i})=>({name,i,group:state.groups.find(g=>g.id===state.studentGroups[i])})).sort((a,b)=>{let ai=a.group?state.groups.indexOf(a.group):9999,bi=b.group?state.groups.indexOf(b.group):9999;return ai-bi||orderedStudentIds().indexOf(a.i)-orderedStudentIds().indexOf(b.i)});

 }).join('');
 $('evaluation').innerHTML=`<div class="tablewrap"><table class="eval-matrix"><thead><tr><th>${head}</th>${r.criteria.map((c,j)=>`<th class="criterion-col"><button title="${esc(c)} — alle leerlingen beoordelen" onclick="bulk('${r.id}',${j})">${esc(c)} ▾</button></th>`).join('')}${r.scoreMode!=='none'?'<th class="total-col">Totaalscore</th>':''}</tr></thead><tbody>${body}</tbody></table></div>`;

th+' geselecteerd'"><span>${esc(n)}</span>${other?`<small>Nu in ${esc(other.name)}</small>`:''}</label>`}).join('')}</div></div></div>`;el.classList.remove('hidden')}

async function importSession(e){if(!checkXlsx()||!e.target.files[0])return;try{let wb=await readExcel(e.target.files[0]);if(!['Sessie','Leerlingen','Rubrics','Scores'].every(n=>wb.SheetNames.includes(n)))throw Error('Dit is geen geldig sessiebestand');let rows=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});let meta=rows('Sessie');if(meta[0]?.[0]!=='LO_EVALUATIE_SESSIE')throw Error('Onbekend sessieformaat');let studentRows=rows('Leerlingen').slice(1);let students=studentRows.map(x=>String(x[1]));let absent=studentRows.map((x,i)=>Number(x[2])===1?i:null).filter(x=>x!==null);let studentNameParts={};studentRows.forEach((r,i)=>{if(r[3]||r[4])studentNameParts[i]={first:String(r[3]||''),last:String(r[4]||'')}});let raw=rows('Rubrics').slice(1),map=new Map();for(let [id,name,ni,level,ci,criterion,description] of raw){if(!map.has(id))map.set(id,{id,name,criteria:[],levels:[],descriptions:[]});let r=map.get(id);r.criteria[ci]=criterion;r.levels[ni]=level;if(!r.descriptions[ni])r.descriptions[ni]=[];r.descriptions[ni][ci]=description}let rubrics=[...map.values()];if(wb.SheetNames.includes('Totaalscores'))for(const [id,mode,j,n,points,i,manual,maxScore] of rows('Totaalscores').slice(1)){let r=map.get(id);if(!r)continue;ensurePoints(r);if(['none','auto','manual'].includes(mode))r.scoreMode=mode;if(maxScore!==''&&Number.isInteger(Number(maxScore))&&Number(maxScore)>0)r.maxScore=Math.min(100,Number(maxScore));if(j!==''&&n!==''&&Number.isInteger(Number(j))&&Number.isInteger(Number(n))&&r.pointValues[Number(j)]&&Number(n)<r.levels.length)r.pointValues[Number(j)][Number(n)]=points===''?'':Number(points);if(i!==''&&Number.isInteger(Number(i))&&manual!=='')r.manualScores[Number(i)]=Number(manual)}if(!rubrics.length)throw Error('Geen rubrics in sessie');let scores={};for(let [id,i,j,n] of rows('Scores').slice(1)){if(!map.has(id)||!Number.isInteger(Number(i))||!Number.isInteger(Number(j))||!Number.isInteger(Number(n)))continue;scores[key(id,i,j)]=Number(n)}let groups=wb.SheetNames.includes('Groepen')?rows('Groepen').slice(1).filter(x=>x[0]).map(x=>({id:String(x[0]),name:String(x[1]||'Groep'),color:groupPalette.includes(String(x[2]))?String(x[2]):groupPalette[0]})):[];let studentGroups={};if(wb.SheetNames.includes('Groepsindeling'))for(let [i,id] of rows('Groepsindeling').slice(1)){if(Number.isInteger(Number(i))&&Number(i)>=0&&Number(i)<students.length&&groups.some(g=>g.id===String(id)))studentGroups[Number(i)]=String(id)}const photos=readPhotoSheet(wb,students.length);const studentOrder=wb.SheetNames.includes('Leerlingvolgorde')?rows('Leerlingvolgorde').slice(1).map(r=>Number(r[0])).filter(i=>Number.isInteger(i)&&i>=0&&i<students.length):students.map((_,i)=>i);if(!confirm('Huidige sessie vervangen door dit bestand?'))return;editorRubricId=rubrics[0].id;state={rubrics,students,studentNameParts,studentOrder,studentNameOrder:meta.find(x=>x[0]==='Naamvolgorde')?.[1]||'first',scores,groups,studentGroups,photos,absent,sessionName:String(meta[1]?.[1]||''),date:String(meta[2]?.[1]||''),activeRubric:map.has(meta[3]?.[1])?meta[3][1]:rubrics[0].id};renderAll();toast('Sessie hersteld')}catch(err){alert('Sessie niet ingeladen: '+err.message)}e.target.value=''}

const photoNormalize=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim().replace(/\s+/g,' ');
const photoSignature=s=>photoNormalize(s).split(' ').sort().join(' ');
function photoMatch(name){const n=photoNormalize(name),sig=photoSignature(name);return state.students.map((s,i)=>({i,s,exact:photoNormalize(s)===n||photoNormalize(studentDisplayName(i))===n,signature:photoSignature(s)===sig||photoSignature(studentDisplayName(i))===sig})).filter(x=>x.exact||x.signature).sort((a,b)=>Number(b.exact)-Number(a.exact));}

let photoWidth=11,photoHeight=10,photoGap=1,photoOrder='surname',photoStatus='Selecteer een PDF met pasfoto’s en selecteerbare namen.';
function updatePhotoCandidateName(k,name){photoCandidates[k].name=name.trim();const matches=photoMatch(name);if(matches.length===1)photoCandidates[k].target=matches[0].i;renderPhotoModal()}
function removePhotoCandidate(k){photoCandidates.splice(k,1);renderPhotoModal()}
function setPhotoTarget(k,v){photoCandidates[k].target=v==='new'?'new':v===''?null:Number(v);renderPhotoModal()}
async function loadPhotoPdf(e){const file=e.target.files[0];e.target.value='';if(!file)return;if(!window.pdfjsLib){photoStatus='PDF-bibliotheek niet geladen. Controleer je internetverbinding.';renderPhotoModal();return}try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';photoDoc=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;photoPdfName=file.name;photoCandidates=[];photoStatus=`${photoDoc.numPages} pagina('s) geladen.`;renderPhotoModal()}catch(err){photoStatus='PDF kon niet worden geopend: '+err.message;renderPhotoModal()}}
function photoTextGroups(items){const rows=[];for(const t of items){if(!t.str.trim())continue;let r=rows.find(x=>Math.abs(x.y-t.y)<Math.max(3,t.h*.55));if(!r){r={y:t.y,items:[]};rows.push(r)}r.items.push(t)}return rows.sort((a,b)=>a.y-b.y).flatMap(r=>{const groups=[];for(const t of r.items.sort((a,b)=>a.x-b.x)){let g=groups.at(-1);if(!g||t.x-g.end>Math.max(18,t.h*1.8)){g={items:[],end:0};groups.push(g)}g.items.push(t);g.end=Math.max(g.end,t.x+t.w)}return groups.map(g=>({text:g.items.map(t=>t.str.trim()).filter(Boolean).join(' ').replace(/\s+/g,' ').trim(),x:Math.min(...g.items.map(t=>t.x)),y:Math.min(...g.items.map(t=>t.y)),w:Math.max(...g.items.map(t=>t.x+t.w))-Math.min(...g.items.map(t=>t.x)),h:Math.max(...g.items.map(t=>t.h))}))})}
function photoLooksName(s){let t=s.trim();if(t.length<3||t.length>70||/\d{2,}|[@:/\\]|^(naam|klas|groep|pagina|school|leerling|foto|geboorte|datum|nummer|nr\.?|studenten|leerlingen)$/i.test(t))return false;const words=t.split(/\s+/);return words.length>=2&&words.length<=6&&words.every(w=>/^[\p{L}][\p{L}'’.-]*$/u.test(w))}
async function analyzePhotoPdf(){if(!photoDoc)return;photoWidth=Number(document.getElementById('photoWidth').value)||16;photoHeight=Number(document.getElementById('photoHeight').value)||20;photoGap=Number(document.getElementById('photoGap').value)||0;photoOrder=document.getElementById('photoOrder').value;photoCandidates=[];photoStatus='PDF analyseren…';renderPhotoModal();try{for(let n=1;n<=photoDoc.numPages;n++){const page=await photoDoc.getPage(n),scale=1.8,viewport=page.getViewport({scale}),canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport}).promise;const text=await page.getTextContent(),items=text.items.map(t=>{const tx=pdfjsLib.Util.transform(viewport.transform,t.transform);return {str:t.str,x:tx[4],y:tx[5]-Math.abs(tx[3]),w:Math.max(1,t.width*scale),h:Math.max(7,Math.abs(tx[3]))}});for(const l of photoTextGroups(items).filter(x=>photoLooksName(x.text))){const w=canvas.width*Math.max(4,Math.min(80,photoWidth))/100,h=canvas.height*Math.max(4,Math.min(80,photoHeight))/100;const cx=Math.max(0,Math.min(canvas.width-w,l.x+l.w/2-w/2)),cy=Math.max(0,Math.min(canvas.height-h,l.y-canvas.height*Math.max(0,Math.min(20,photoGap))/100-h));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));c.getContext('2d').drawImage(canvas,cx,cy,w,h,0,0,c.width,c.height);const matches=photoMatch(l.text);photoCandidates.push({name:l.text,image:c.toDataURL('image/jpeg',.78),target:matches.length===1?matches[0].i:state.students.length===0?'new':null,page:n})}}photoStatus=`${photoCandidates.length} mogelijke foto’s gevonden. Controleer en corrigeer de koppelingen.`;renderPhotoModal()}catch(err){photoStatus='Analyse mislukt: '+err.message;renderPhotoModal()}}
function commitPhotoCandidates(){let assigned=new Set(),added=0,linked=0,skipped=0;state.photos=state.photos||{};for(const c of photoCandidates){let i=c.target;if(i==='new'){const match=photoMatch(c.name);if(match.length===1)i=match[0].i;else{ i=state.students.length;state.students.push(c.name);state.studentNameParts=state.studentNameParts||{};state.studentNameParts[i]=splitImportedName(c.name,photoOrder);added++}}if(!Number.isInteger(i)||i<0||i>=state.students.length){skipped++;continue}if(assigned.has(i)){skipped++;continue}assigned.add(i);state.photos[i]=c.image;linked++}closePhotoImporter();renderEval();renderStudents();toast(`${linked} foto’s gekoppeld · ${added} leerlingen toegevoegd${skipped?' · '+skipped+' overgeslagen':''}`)}
function hidePhotoPopover(){const el=document.getElementById('photoPopover');el.classList.add('hidden');el.innerHTML=''}
function showStudentPhoto(i,event){const photo=state.photos?.[i];if(!photo){toast('Voor deze leerling is nog geen foto gekoppeld');return}const el=document.getElementById('photoPopover');if(!el.classList.contains('hidden')&&el.dataset.index===String(i)){hidePhotoPopover();return}el.dataset.index=String(i);el.innerHTML=`<button class="photo-pop-close" onclick="hidePhotoPopover()" aria-label="Sluiten">×</button><img src="${photo}" alt="Foto van ${esc(state.students[i])}"><div>${esc(studentDisplayName(i))}</div>`;el.classList.remove('hidden');const rect=event.currentTarget.getBoundingClientRect();el.style.left=Math.max(8,Math.min(window.innerWidth-190,rect.right+10))+'px';el.style.top=Math.max(8,Math.min(window.innerHeight-255,rect.top-25))+'px'}

function addPhotoSheet(wb){const rows=[['LeerlingIndex','Deel','AfbeeldingJPEGBase64']];for(const [index,data] of Object.entries(state.photos||{})){if(!data?.startsWith('data:image/jpeg;base64,'))continue;const b64=data.slice('data:image/jpeg;base64,'.length);for(let p=0;p<b64.length;p+=28000)rows.push([Number(index),p/28000,b64.slice(p,p+28000)])}if(rows.length>1)XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Leerlingfotos')}
function readPhotoSheet(wb,max){const photos={};if(!wb.SheetNames.includes('Leerlingfotos'))return photos;const rows=XLSX.utils.sheet_to_json(wb.Sheets['Leerlingfotos'],{header:1,defval:''}).slice(1),chunks={};for(const [index,part,chunk] of rows){const i=Number(index);if(!Number.isInteger(i)||i<0||i>=max||!Number.isInteger(Number(part))||typeof chunk!=='string')continue;(chunks[i]??=[])[Number(part)]=chunk}for(const [i,parts] of Object.entries(chunks))if(parts.length&&parts.every(x=>typeof x==='string'))photos[i]='data:image/jpeg;base64,'+parts.join('');return photos}


function splitImportedName(name,order){const words=String(name||'').trim().split(/\s+/).filter(Boolean);if(words.length<2)return {first:words[0]||'',last:''};return order==='surname'?{first:words.slice(1).join(' '),last:words[0]}:{first:words[0],last:words.slice(1).join(' ')}}
function getStudentParts(i){return state.studentNameParts?.[i]||splitImportedName(state.students[i],state.studentNameOrder==='last'?'surname':'firstname')}
function studentDisplayName(i){const p=getStudentParts(i);return (state.studentNameOrder==='last'?[p.last,p.first]:[p.first,p.last]).filter(Boolean).join(' ')||state.students[i]}
function setNameOrder(order){state.studentNameOrder=order==='last'?'last':'first';renderStudents();renderEval()}
function openStudentEditor(i){const p=getStudentParts(i),el=$('studentEditModal');el.classList.remove('hidden');el.innerHTML=`<div class="bulk-backdrop" onclick="if(event.target===this)closeStudentEditor()"><div class="bulk-dialog student-edit-dialog" onclick="event.stopPropagation()" role="dialog" aria-modal="true"><div class="bulk-head"><h3>Naam leerling aanpassen</h3><button onclick="closeStudentEditor()" aria-label="Sluiten">×</button></div><label>Voornaam<input id="studentFirstEdit" value="${esc(p.first)}"></label><label>Achternaam<input id="studentLastEdit" value="${esc(p.last)}"></label><div class="module-actions"><button class="primary" onclick="saveStudentEditor(${i})">Bewaren</button><button onclick="closeStudentEditor()">Annuleren</button></div></div></div>`}
function closeStudentEditor(){$('studentEditModal').classList.add('hidden');$('studentEditModal').innerHTML=''}
function saveStudentEditor(i){const first=$('studentFirstEdit').value.trim(),last=$('studentLastEdit').value.trim();if(!first&&!last)return toast('Vul een naam in');state.studentNameParts=state.studentNameParts||{};state.studentNameParts[i]={first,last};state.students[i]=[first,last].filter(Boolean).join(' ');closeStudentEditor();renderStudents();renderEval()}
function orderedStudentIds(){const n=state.students.length;const existing=(state.studentOrder||[]).filter(i=>Number.isInteger(i)&&i>=0&&i<n);const seen=new Set(existing);for(let i=0;i<n;i++)if(!seen.has(i))existing.push(i);return existing}
function toggleStudentOptions(){const panel=$('studentActions');const open=panel.classList.toggle('hidden')===false;const btn=$('studentOptionsButton');btn.textContent=open?'Minder opties ▴':'Meer opties ▾';btn.setAttribute('aria-expanded',String(open));}
function updateStudentToolbar(){/* Opties blijven beschikbaar, ook zonder leerlingen. */}
function reorderStudent(from,to){if(from===to||from==null||to==null)return;const a=state.studentGroups[from]||null,b=state.studentGroups[to]||null;if(a!==b){toast('Verplaatsen kan alleen binnen dezelfde groep');return}const order=orderedStudentIds();const fi=order.indexOf(from),ti=order.indexOf(to);if(fi<0||ti<0)return;order.splice(fi,1);order.splice(ti,0,from);state.studentOrder=order;renderStudents();renderEval()}
let studentDragId=null;
function beginStudentDrag(event,i){if(event.button!==undefined&&event.button!==0)return;studentDragId=i;const h=event.currentTarget;h.setPointerCapture?.(event.pointerId);h.classList.add('dragging');event.preventDefault()}
function finishStudentDrag(event){const from=studentDragId;studentDragId=null;document.querySelectorAll('.student-drag.dragging').forEach(el=>el.classList.remove('dragging'));if(from==null)return;const el=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-student-index]');if(el)reorderStudent(from,Number(el.dataset.studentIndex))}
function renderStudents(){const root=$('studentManager');if(!root)return;const absent=new Set(state.absent||[]);$('studentNameOrder').value=state.studentNameOrder||'first';updateStudentToolbar();const order=orderedStudentIds();const grouped=state.groups?.length>0;const ids=grouped?[...order.filter(i=>!state.studentGroups[i]),...state.groups.flatMap(g=>order.filter(i=>state.studentGroups[i]===g.id))]:order;
root.innerHTML=state.students.length?`<div class="student-list"><div class="student-counter">${state.students.length} leerlingen · ${absent.size} afwezig</div><div class="student-line student-line-head"><span>Leerling</span><span>Groep</span><span>Afwezig</span><span></span></div>${ids.map(i=>{const name=state.students[i];const group=state.groups.find(g=>g.id===state.studentGroups[i]);return `<div class="student-line ${absent.has(i)?'student-absent':''}" data-student-index="${i}"><span class="student-identity"><button type="button" class="student-drag" title="Leerling verslepen" aria-label="${esc(name)} verplaatsen" onpointerdown="beginStudentDrag(event,${i})" onpointerup="finishStudentDrag(event)" onpointercancel="studentDragId=null">⠿</button>${state.photos?.[i]?`<button class="student-thumb" onclick="showStudentPhoto(${i},event)" title="Foto bekijken"><img src="${state.photos[i]}" alt=""></button>`:'<span class="student-thumb-placeholder">○</span>'}<button class="student-name-link" onclick="openStudentEditor(${i})" title="Naam aanpassen">${esc(studentDisplayName(i))}</button></span><span>${group?`<span class="group-dot" style="background:${group.color}"></span>${esc(group.name)}`:'—'}</span><span><input type="checkbox" aria-label="${esc(name)} afwezig" ${absent.has(i)?'checked':''} onchange="setStudentAbsent(${i},this.checked)"></span><span><button class="student-delete" title="Leerling verwijderen" aria-label="${esc(name)} verwijderen" onclick="deleteStudent(${i})">×</button></span></div>`}).join('')}</div>`:`<div class="empty-state"><div class="student-counter">${state.students.length} leerlingen · ${absent.size} afwezig</div><h3>Nog geen leerlingen</h3><div class="empty-start-actions"><button class="primary" onclick="document.getElementById(&quot;classFile&quot;).click()">Klaslijst importeren</button><button onclick="openPhotoImporter()">Fotolijst importeren</button></div></div>`}

function setStudentAbsent(i,flag){const a=new Set(state.absent||[]);if(flag)a.add(i);else a.delete(i);state.absent=[...a].sort((x,y)=>x-y);renderStudents();renderEval()}
function deleteStudent(i){const name=state.students[i];if(!confirm('Leerling '+name+' definitief verwijderen? De scores en foto van deze leerling verdwijnen ook uit deze sessie.'))return;state.students.splice(i,1);state.studentOrder=(state.studentOrder||[]).filter(n=>n!==i).map(n=>n>i?n-1:n);state.absent=(state.absent||[]).filter(n=>n!==i).map(n=>n>i?n-1:n);const shift=obj=>Object.fromEntries(Object.entries(obj||{}).filter(([k])=>Number(k)!==i).map(([k,v])=>[Number(k)>i?Number(k)-1:k,v]));state.studentGroups=shift(state.studentGroups);state.photos=shift(state.photos);state.studentNameParts=shift(state.studentNameParts);state.scores=Object.fromEntries(Object.entries(state.scores).filter(([k])=>Number(k.split('|')[1])!==i).map(([k,v])=>{let p=k.split('|');if(Number(p[1])>i)p[1]=String(Number(p[1])-1);return [p.join('|'),v]}));state.rubrics.forEach(r=>r.manualScores=shift(r.manualScores));renderStudents();renderEval();toast('Leerling verwijderd')}

renderAll();
</script><script>
function openRubricInfo(){
 const el=document.getElementById('rubricInfoModal');
 el.innerHTML=`<div class="bulk-backdrop" onclick="if(event.target===this)closeRubricInfo()"><div class="bulk-dialog" role="dialog" aria-modal="true" aria-label="Rubricinformatie"><div class="bulk-head"><h3>Info</h3><button onclick="closeRubricInfo()" aria-label="Sluiten">×</button></div><ul class="rubric-info-list"><li>Maak een nieuwe rubric of importeer er één uit Excel.</li><li>Pas criteria, niveaus en beschrijvingen aan.</li><li>Gebruik meerdere rubrics binnen één evaluatiesessie.</li><li>Exporteer rubrics naar Excel of als afdrukbare PDF.</li></ul><p><strong>Excel importeren</strong></p><ul class="rubric-info-list"><li>Elk tabblad bevat één rubric; de tabbladnaam is de rubricnaam.</li><li>Criteria: kolom A, vanaf A2.</li><li>Niveaus: rij 1, vanaf B1.</li><li>Overige cellen: beschrijvingen.</li></ul></div></div>`;
 el.classList.remove('hidden');
}
function closeRubricInfo(){const el=document.getElementById('rubricInfoModal');el.classList.add('hidden');el.innerHTML='';}
</script></body></html>
