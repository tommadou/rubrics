</style></head><body><header class="app-header"><div class="header-inner"><h1>lo-tools.be <small>· rubrics</small></h1><nav class="header-nav" aria-label="Modules"><button id="navDesign" class="active" onclick="show('design')">Rubricontwerper</button><button id="navEval" onclick="show('eval')">Evalueren</button></nav></div></header><main><div id="design"><section><div class="design-topline"><div id="rubricSelector" class="design-rubric-bar"><div id="designTabs" class="rubric-tabs" role="tablist" aria-label="Rubrics bewerken"></div></div><button type="button" id="designSettingsButton" aria-expanded="false" aria-controls="designSettings" onclick="toggleDesignSettings()">Meer opties ▾</button><input class="hidden" id="rubricFile" type="file" accept=".xlsx,.xls" onchange="importRubrics(event)"></div><div id="designSettings" class="settings-panel hidden"><div class="settings-grid"><button onclick="newRubric()">Rubric toevoegen</button><button onclick="deleteRubric()">Rubric verwijderen</button><button onclick="document.getElementById('rubricFile').click()">Rubrics importeren</button><button onclick="exportRubrics()">Rubrics exporteren</button><button onclick="printRubric()">Rubric afdrukken</button><button type="button" id="excelInfoBtn" aria-haspopup="dialog" onclick="openRubricInfo()">Info</button></div><div id="designEditActions" class="settings-grid design-edit-actions"><button onclick="renameCurrentRubric()">Naam wijzigen</button><button onclick="openScoreSettings()">Score-instellingen</button><button type="button" id="autoScoreToggle" class="hidden" aria-pressed="false" onclick="toggleAutoScoreVisibility()">✓ Automatische scores: tonen ▾</button><button type="button" id="manualScoreToggle" class="hidden" onclick="openScoreSettings()">✓ Handmatige scores</button><button onclick="openCountPicker('criteria')">Criteria</button><button onclick="openCountPicker('levels')">Niveaus</button></div></div><div id="editor"></div></section></div><div id="eval" class="hidden"><section class="eval-section">
<div class="eval-toolbar"><div class="rubric-bar"><div id="evalTabs" class="rubric-tabs" role="tablist" aria-label="Rubrics"></div></div><div class="toolbar-buttons"><button class="iconbutton" id="settingsButton" aria-expanded="false" aria-controls="sessionSettings" onclick="toggleSettings()" title="Meer opties">Meer opties ▾</button></div></div>
<div id="sessionSettings" class="settings-panel hidden"><div class="settings-grid"><button type="button" id="sessionTitle" onclick="openSessionNameDialog()" title="Sessienaam instellen of wijzigen">Sessienaam instellen</button><div class="settings-date"><input aria-label="Datum" id="sessionDate" type="date" onchange="state.date=this.value"></div><button onclick="document.getElementById(&quot;classFile&quot;).click()">Klaslijst importeren</button><button onclick="addStudent()">Leerling toevoegen</button><button onclick="openGroups()">Groepen</button><button onclick="exportSession()">Sessie bewaren</button><button onclick="exportResults()">Resultaten exporteren</button><button onclick="document.getElementById(&quot;sessionFile&quot;).click()">Sessie hervatten</button><button onclick="openEvalInfo()">Info</button></div><input id="classFile" class="hidden" type="file" accept=".xlsx,.xls" onchange="importClass(event)"><input id="sessionFile" class="hidden" type="file" accept=".xlsx" onchange="importSession(event)"></div>

<div id="evaluation"></div></section></div></main><div id="print" class="rubricprint"></div><div id="toast"></div><div id="bulkModal" class="hidden"></div><div id="groupModal" class="hidden"></div><div id="undoBar" class="hidden"></div><div id="evalInfoModal" class="hidden"></div><div id="rubricInfoModal" class="hidden"></div><div id="scorePickerModal" class="hidden"></div><div id="scoreModal" class="hidden"></div><div id="rubricNameModal" class="hidden"></div><div id="sessionNameModal" class="hidden"></div><div id="countModal" class="hidden"></div><script>
const blank=()=>({scoreMode:'none',pointValues:[],manualScores:{},maxScore:20,id:crypto.randomUUID(),name:'Nieuwe rubric',criteria:['Criterium 1','Criterium 2'],levels:['Niveau 4','Niveau 3','Niveau 2','Niveau 1'],descriptions:Array.from({length:4},()=>['',''])});
let editorRubricId='';
const visibleAutoScores=new Set();
let state={rubrics:[],students:[],scores:{},sessionName:'',date:new Date().toISOString().slice(0,10),activeRubric:'',groups:[],studentGroups:{}};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2700)}
function show(tab){$('design').classList.toggle('hidden',tab!=='design');$('eval').classList.toggle('hidden',tab!=='eval');$('navDesign').classList.toggle('active',tab==='design');$('navEval').classList.toggle('active',tab==='eval');renderAll()}
function chosen(){return state.rubrics.find(r=>r.id===editorRubricId)||state.rubrics[0]}
function ensurePoints(r){if(!r.pointValues)r.pointValues=[];if(!r.manualScores)r.manualScores={};if(!r.scoreMode)r.scoreMode='none';if(!Number.isInteger(Number(r.maxScore))||Number(r.maxScore)<1)r.maxScore=20;r.criteria.forEach((_,j)=>{if(!r.pointValues[j])r.pointValues[j]=[];r.levels.forEach((_,n)=>{if(r.pointValues[j][n]===undefined)r.pointValues[j][n]=r.levels.length-1-n})})}
function openScoreSettings(){const r=chosen();if(!r)return;ensurePoints(r);renderScoreSettings();$('scoreModal').classList.remove('hidden')}
function closeScoreSettings(showAutomatic=false){const r=chosen();if(showAutomatic&&r?.scoreMode==='auto')visibleAutoScores.add(r.id);$('scoreModal').classList.add('hidden');$('scoreModal').innerHTML='';renderAll()}
function setScoreMode(mode){const r=chosen();ensurePoints(r);r.scoreMode=mode;renderScoreSettings();renderEval()}
function setPointValue(j,n,v){const r=chosen();ensurePoints(r);r.pointValues[j][n]=v===''?'':Number(v);renderEval()}
function setMaxScore(v){const r=chosen();if(!r)return;const max=Math.max(1,Math.min(100,Math.round(Number(v)||20)));r.maxScore=max;Object.keys(r.manualScores||{}).forEach(k=>{if(Number(r.manualScores[k])>max)delete r.manualScores[k]});renderScoreSettings();renderEval()}
function openManualPicker(rid,i,event){const r=state.rubrics.find(x=>x.id===rid);if(!r)return;ensurePoints(r);const max=r.maxScore;const existing=r.manualScores[i];const modal=$('scorePickerModal');modal.innerHTML=`<div class="score-picker-backdrop" onclick="if(event.target===this)closeManualPicker()"><div class="score-picker" role="dialog" aria-modal="true" aria-label="Totaalscore kiezen"><div class="bulk-head"><h3>Kies een score /${max}</h3><button onclick="closeManualPicker()" aria-label="Sluiten">×</button></div><div class="score-picker-grid">${Array.from({length:max+1},(_,j)=>max-j).map(n=>`<button class="${existing===n?'chosen':''}" onclick="chooseManualScore('${rid}',${i},${n})">${n}</button>`).join('')}</div><button class="score-clear" onclick="chooseManualScore('${rid}',${i},null)">Score wissen</button></div></div>`;modal.classList.remove('hidden');const rect=event?.currentTarget?.getBoundingClientRect();const picker=modal.querySelector('.score-picker');if(rect&&window.innerWidth>=700){picker.style.position='fixed';picker.style.left=Math.max(12,Math.min(rect.left,window.innerWidth-332))+'px';picker.style.top=Math.max(12,Math.min(rect.bottom+7,window.innerHeight-Math.min(480,picker.scrollHeight)-12))+'px'}}
function closeManualPicker(){$('scorePickerModal').classList.add('hidden');$('scorePickerModal').innerHTML=''}
function chooseManualScore(rid,i,n){setManualScore(rid,i,n===null?'':n);closeManualPicker();renderEval()}
function setManualScore(rid,i,v){const r=state.rubrics.find(x=>x.id===rid);if(!r)return;ensurePoints(r);if(v==='')delete r.manualScores[i];else r.manualScores[i]=Number(v)}
function totalScore(r,i){ensurePoints(r);let sum=0,any=false;r.criteria.forEach((_,j)=>{const n=state.scores[key(r.id,i,j)];if(n!==undefined){any=true;sum+=Number(r.pointValues[j]?.[n])||0}});return any?String(Math.round(sum*100)/100):'—'}
function renderScoreSettings(){const r=chosen();ensurePoints(r);const mode=r.scoreMode;const modal=$('scoreModal');modal.innerHTML=`<div class="bulk-backdrop" onclick="if(event.target===this)closeScoreSettings()"><div class="bulk-dialog score-dialog" role="dialog" aria-modal="true" aria-label="Score-instellingen"><div class="bulk-head"><h3>Score-instellingen</h3><button onclick="closeScoreSettings()" aria-label="Sluiten">×</button></div><div class="score-modes"><label><input type="radio" name="scoreMode" value="none" ${mode==='none'?'checked':''} onchange="setScoreMode('none')"> Geen totaalscore</label><label><input type="radio" name="scoreMode" value="auto" ${mode==='auto'?'checked':''} onchange="setScoreMode('auto')"> Automatisch berekenen</label><label><input type="radio" name="scoreMode" value="manual" ${mode==='manual'?'checked':''} onchange="setScoreMode('manual')"> Handmatig invoeren</label></div>${mode==='auto'?'<p class="score-note">Pas de punten aan in de rubric via ‘Automatische scores: tonen’.</p>':mode==='manual'?`<div class="score-max-setting"><label for="maxScore">Maximumscore</label><input id="maxScore" type="number" min="1" max="100" step="1" value="${r.maxScore}" onchange="setMaxScore(this.value)"><span>punten</span></div>`:''}<div class="score-footer"><button class="primary" onclick="closeScoreSettings(true)">Gereed</button></div></div></div>`}
function toggleAutoScoreVisibility(){const r=chosen();if(!r||r.scoreMode!=='auto')return;if(visibleAutoScores.has(r.id))visibleAutoScores.delete(r.id);else visibleAutoScores.add(r.id);renderAll()}
function adjustAutoPoints(axis,index,delta){const r=chosen();if(!r||r.scoreMode!=='auto')return;ensurePoints(r);for(let j=0;j<r.criteria.length;j++){for(let n=0;n<r.levels.length;n++){if(axis==='cell'&&j!==index[0]||axis==='cell'&&n!==index[1])continue;if(axis==='criterion'&&j!==index||axis==='level'&&n!==index)continue;r.pointValues[j][n]=Math.max(0,(Number(r.pointValues[j][n])||0)+delta)}}const wrap=document.querySelector('#editor .tablewrap');const scrollTop=wrap?.scrollTop??0;const scrollLeft=wrap?.scrollLeft??0;const pageX=window.scrollX,pageY=window.scrollY;renderAll();const updated=document.querySelector('#editor .tablewrap');if(updated){updated.scrollTop=scrollTop;updated.scrollLeft=scrollLeft}window.scrollTo(pageX,pageY)}
function pointControl(axis,index,value,label){const arg=Array.isArray(index)?`[${index.join(',')}]`:index;return `<div class="point-control" aria-label="${esc(label)}"><button type="button" aria-label="${esc(label)} verlagen" onclick="adjustAutoPoints('${axis}',${arg},-1)">−</button><span>${value===null?'±1':esc(value)}</span><button type="button" aria-label="${esc(label)} verhogen" onclick="adjustAutoPoints('${axis}',${arg},1)">+</button></div>`}

function openRubricNameDialog(mode){
 const current=chosen();if(mode==='rename'&&!current)return;
 const modal=$('rubricNameModal');const existing=mode==='rename'?current.name:'';
 modal.innerHTML=`<div class="bulk-backdrop" onclick="if(event.target===this)closeRubricNameDialog()"><div class="bulk-dialog rubric-name-dialog" role="dialog" aria-modal="true" aria-labelledby="rubricNameTitle"><div class="bulk-head"><h3 id="rubricNameTitle">${mode==='rename'?'Naam wijzigen':'Nieuwe rubric'}</h3><button type="button" onclick="closeRubricNameDialog()" aria-label="Sluiten">×</button></div><form onsubmit="saveRubricName(event,'${mode}')"><label for="rubricNameInput">Naam rubric</label><input id="rubricNameInput" type="text" maxlength="100" required value="${esc(existing)}" placeholder="Naam rubric" autocomplete="off"><div class="score-footer"><button type="button" onclick="closeRubricNameDialog()">Annuleren</button><button type="submit" class="primary">${mode==='rename'?'Opslaan':'Aanmaken'}</button></div></form></div></div>`;
 modal.classList.remove('hidden');const input=$('rubricNameInput');input.focus();if(mode==='rename')input.select();
}
function closeRubricNameDialog(){$('rubricNameModal').classList.add('hidden');$('rubricNameModal').innerHTML=''}
function saveRubricName(event,mode){event.preventDefault();const name=$('rubricNameInput').value.trim();if(!name)return; if(mode==='rename'){const r=chosen();if(r)r.name=name;}else{const r=blank();r.name=name;state.rubrics.push(r);if(!state.activeRubric)state.activeRubric=r.id;editorRubricId=r.id;}closeRubricNameDialog();renderAll()}
function newRubric(){openRubricNameDialog('new')}
function renameCurrentRubric(){openRubricNameDialog('rename')}
function deleteRubric(){if(!state.rubrics.length)return;let r=chosen();if(!confirm('Rubric '+r.name+' verwijderen?'))return;state.rubrics=state.rubrics.filter(x=>x.id!==r.id);if(state.activeRubric===r.id)state.activeRubric=state.rubrics[0]?.id||'';if(editorRubricId===r.id)editorRubricId=state.rubrics[0]?.id||'';renderAll()}
function selectDesignRubric(id){editorRubricId=id;renderAll()}
function renderDesignTabs(){const tabs=$('designTabs');tabs.innerHTML=state.rubrics.map(r=>`<button role="tab" aria-selected="${r.id===editorRubricId}" class="rubric-tab ${r.id===editorRubricId?'selected':''}" onclick="selectDesignRubric('${esc(r.id)}')">${esc(r.name)}</button>`).join('')}
function renderAll(){if(!state.rubrics.some(r=>r.id===editorRubricId))editorRubricId=state.rubrics[0]?.id||'';const active=chosen();const auto=active?.scoreMode==='auto';const toggle=$('autoScoreToggle');toggle.classList.toggle('hidden',!auto);if(auto){const visible=visibleAutoScores.has(active.id);toggle.textContent=visible?'✓ Automatische scores: verbergen ▴':'✓ Automatische scores: tonen ▾';toggle.setAttribute('aria-pressed',String(visible));}$('manualScoreToggle').classList.toggle('hidden',active?.scoreMode!=='manual');$('rubricSelector').classList.toggle('hidden',!state.rubrics.length);$('designEditActions').classList.toggle('hidden',!state.rubrics.length);renderDesignTabs();renderSessionTitle();$('sessionDate').value=state.date;renderEditor();renderEval()}
function renderEditor(){
 let r=chosen();
 if(!r){$('editor').innerHTML='<div class="empty-state"><div class="empty-icon">＋</div><h3>Nog geen rubrics</h3><button class="primary" onclick="newRubric()">Nieuwe rubric maken</button><button onclick="document.getElementById(&quot;rubricFile&quot;).click()">Rubric importeren</button></div>';return;}
 ensurePoints(r);

function openCountPicker(kind){
 const r=chosen();if(!r)return;
 const isCriteria=kind==='criteria',current=isCriteria?r.criteria.length:r.levels.length;
 const min=isCriteria?1:2,max=isCriteria?15:6;
 const title=isCriteria?'Aantal criteria':'Aantal niveaus';
 $('countModal').innerHTML=`<div class="bulk-backdrop" onclick="if(event.target===this)closeCountPicker()"><div class="bulk-dialog count-dialog" role="dialog" aria-modal="true" aria-label="${title}"><div class="bulk-head"><h3>${title}</h3><button onclick="closeCountPicker()" aria-label="Sluiten">×</button></div><div class="count-grid">${Array.from({length:max-min+1},(_,i)=>i+min).map(n=>`<button class="${n===current?'chosen':''}" onclick="setRubricCount('${kind}',${n})">${n}</button>`).join('')}</div><p class="count-note">Bestaande inhoud blijft behouden wanneer je het aantal verhoogt.</p></div></div>`;

function setRubricCount(kind,count){
 const r=chosen();if(!r)return;
 const isCriteria=kind==='criteria',current=isCriteria?r.criteria.length:r.levels.length;
 if(count<current){
  const text=isCriteria?'criteria':'niveaus';
  if(!confirm(`Aantal ${text} verlagen van ${current} naar ${count}? De verwijderde onderdelen en bijbehorende beschrijvingen worden uit de rubric gehaald.`))return;
 }
 if(isCriteria){
  while(r.criteria.length<count)addCriterion(false);
  while(r.criteria.length>count)removeCriterion(r.criteria.length-1,false);
 }else{
  while(r.levels.length<count)addLevel(false);
  while(r.levels.length>count)removeLevel(false);
 }
 closeCountPicker();renderAll();
}
function addCriterion(refresh=true){let r=chosen();r.criteria.push('Nieuw criterium');if(r.pointValues)r.pointValues.push(r.levels.map((_,n)=>r.levels.length-1-n));r.descriptions.forEach(a=>a.push(''));if(refresh)renderAll()}
function removeCriterion(j,refresh=true){let r=chosen();if(r.criteria.length<2)return toast('Minstens één criterium behouden');r.criteria.splice(j,1);if(r.pointValues)r.pointValues.splice(j,1);r.descriptions.forEach(a=>a.splice(j,1));if(refresh)renderAll()}
function addLevel(refresh=true){let r=chosen();if(r.levels.length>=6)return toast('Maximaal zes niveaus');r.levels.push('Niveau '+(r.levels.length+1));if(r.pointValues)r.pointValues.forEach(a=>a.push(0));r.descriptions.push(r.criteria.map(() => ''));if(refresh)renderAll()}
function removeLevel(refresh=true){let r=chosen();if(r.levels.length<=2)return toast('Minstens twee niveaus');r.levels.pop();if(r.pointValues)r.pointValues.forEach(a=>a.pop());r.descriptions.pop();if(refresh)renderAll()}
function readExcel(file){return file.arrayBuffer().then(b=>XLSX.read(b,{type:'array'}))}
function checkXlsx(){if(!window.XLSX){toast('Excel-bibliotheek niet geladen. Controleer internetverbinding.');return false}return true}
async function importRubrics(e){
 if(!checkXlsx()||!e.target.files[0])return;
 try{
  const wb=await readExcel(e.target.files[0]),arr=[],bySheet=new Map();
  let config=null;
  if(wb.SheetNames.includes('_Score-instellingen')){
   const raw=XLSX.utils.sheet_to_json(wb.Sheets['_Score-instellingen'],{header:1,defval:''});
   if(raw[0]?.[0]==='LO_RUBRIC_SCORES_V1')config=raw.slice(1);
  }
  for(const sheet of wb.SheetNames){
   if(sheet==='_Score-instellingen')continue;
   const a=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:''});
   const header=a[0]||[];
   const levelIndices=header.map((v,i)=>i>0&&String(v).trim()?i:-1).filter(i=>i>0);
   const rows=a.slice(1).filter(x=>String(x[0]??'').trim());
   if(!levelIndices.length||!rows.length)continue;
   const r={id:crypto.randomUUID(),name:sheet,criteria:rows.map(x=>String(x[0]).trim()),levels:levelIndices.map(i=>String(header[i]).trim()),descriptions:levelIndices.map(i=>rows.map(row=>String(row[i]??'')))};
   arr.push(r);bySheet.set(sheet,r);
  }
  if(!arr.length)throw Error('Geen geldig tabblad: verwacht niveaus vanaf B1 en criteria vanaf A2');
  if(config)for(const row of config){
   const [sheet,mode,max,j,n,points]=row,r=bySheet.get(String(sheet));
   if(!r)continue;
   ensurePoints(r);
   if(['none','auto','manual'].includes(mode))r.scoreMode=mode;
   if(max!==''&&Number.isInteger(Number(max))&&Number(max)>=1)r.maxScore=Math.min(100,Number(max));
   if(j!==''&&n!==''&&Number.isInteger(Number(j))&&Number.isInteger(Number(n))&&Number(j)>=0&&Number(j)<r.criteria.length&&Number(n)>=0&&Number(n)<r.levels.length){r.pointValues[Number(j)][Number(n)]=points===''?'':Number(points)}
  }
  state.rubrics.push(...arr);editorRubricId=arr[0].id;
  if(!state.activeRubric)state.activeRubric=arr[0].id;
  renderAll();toast(arr.length+' rubric(s) geïmporteerd');
 }catch(err){alert('Import mislukt: '+err.message)}
 e.target.value='';
}
function rubricSheet(r){return [ ['',...r.levels],...r.criteria.map((c,j)=>[c,...r.levels.map((_,i)=>r.descriptions[i]?.[j]||'')]) ]}
function exportRubrics(){
 if(!state.rubrics.length)return toast('Maak of importeer eerst een rubric');
 if(!checkXlsx())return;
 const wb=XLSX.utils.book_new(),config=[['LO_RUBRIC_SCORES_V1','Modus','Maximumscore','CriteriumIndex','NiveauIndex','Punten']];
 state.rubrics.forEach((r,i)=>{
  ensurePoints(r);
  const sheet=uniqueSheetName(wb,r.name||'Rubric '+(i+1));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rubricSheet(r)),sheet);
  config.push([sheet,r.scoreMode,r.maxScore,'','','']);
  r.criteria.forEach((_,j)=>r.levels.forEach((_,n)=>config.push([sheet,'','',j,n,r.pointValues[j][n]])));
 });
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(config),'_Score-instellingen');
 if(!wb.Workbook)wb.Workbook={};if(!wb.Workbook.Sheets)wb.Workbook.Sheets=wb.SheetNames.map(name=>({name}));const sh=wb.Workbook.Sheets.find(x=>x.name==='_Score-instellingen');if(sh)sh.Hidden=1;
 XLSX.writeFile(wb,'LO-rubrics.xlsx');
}
function uniqueSheetName(wb,name){let base=name.replace(/[\\/?*\[\]:]/g,' ').slice(0,27)||'Rubric',n=base,k=2;while(wb.SheetNames.includes(n))n=(base.slice(0,25)+' '+k++).slice(0,31);return n}

function renderEval(){
 renderSessionTitle();renderEvalTabs();
 const r=state.rubrics.find(x=>x.id===state.activeRubric)||state.rubrics[0];
 if(r&&state.activeRubric!==r.id){state.activeRubric=r.id;renderEvalTabs()}
 if(!r){$('evaluation').innerHTML='<div class="empty-state"><h3>Nog geen rubric beschikbaar</h3><div class="empty-start-actions"><button onclick="show(&quot;design&quot;)">Naar rubricontwerper</button><button class="primary" onclick="document.getElementById(&quot;sessionFile&quot;).click()">Sessie hervatten</button></div></div>';return}
 if(!state.students.length){$('evaluation').innerHTML='<div class="empty-state"><h3>Nog geen leerlingen</h3><div class="empty-start-actions"><button onclick="addStudent()">Leerling toevoegen</button><button class="primary" onclick="document.getElementById(&quot;classFile&quot;).click()">Klaslijst importeren</button><button onclick="document.getElementById(&quot;sessionFile&quot;).click()">Sessie hervatten</button></div></div>';return}
 ensurePoints(r);
 const hasGroups=state.groups.some(g=>state.students.some((_,i)=>state.studentGroups[i]===g.id));
 if(!hasGroups)evaluationView='students';
 const groupMode=hasGroups&&evaluationView==='groups';
 const rows=groupMode?state.groups.filter(g=>state.students.some((_,i)=>state.studentGroups[i]===g.id)).map(g=>({name:g.name,group:g,groupRow:true})):state.students.map((name,i)=>({name,i,group:state.groups.find(g=>g.id===state.studentGroups[i])})).sort((a,b)=>{let ai=a.group?state.groups.indexOf(a.group):9999,bi=b.group?state.groups.indexOf(b.group):9999;return ai-bi||a.i-b.i});
 const head=hasGroups?`<button type="button" class="view-switch" onclick="toggleEvaluationView()" title="Wissel tussen leerlingen en groepen">${groupMode?'Groep':'Leerling'} ▾</button>`:'Leerling';
 const levelButton=(j,n,selected,click)=>`<button class="${selected?'sel':''}" title="${esc(r.levels[n])}: ${esc(r.descriptions[n]?.[j]||'')}" onclick="${click}">${r.scoreMode==='auto'?esc(r.pointValues?.[j]?.[n]??(r.levels.length-1-n)):r.levels.length-n}</button>`;
 const body=rows.map(row=>{
  const members=row.groupRow?state.students.map((_,i)=>i).filter(i=>state.studentGroups[i]===row.group.id):[row.i];
  const cells=r.criteria.map((c,j)=>{const selected=row.groupRow?groupLevel(r,row.group.id,j):state.scores[key(r.id,row.i,j)];return `<td class="criterion-col"><div class="segments">${r.levels.map((l,n)=>levelButton(j,n,selected===n,row.groupRow?`setGroupScore('${r.id}','${row.group.id}',${j},${n})`:`score('${r.id}',${row.i},${j},${n})`)).join('')}</div></td>`}).join('');
  let total='';
  if(r.scoreMode==='auto'){const values=members.map(i=>formattedTotal(r,i));const same=values.length&&values.every(v=>v===values[0]);total=`<td class="total-col total-value">${same?values[0]:'—'}</td>`}
  else if(r.scoreMode==='manual'){
   if(row.groupRow){const values=members.map(i=>r.manualScores?.[i]);const same=values.length&&values.every(v=>v!==undefined&&v===values[0]);total=`<td class="total-col total-value">${same?esc(values[0])+'/'+r.maxScore:'—'}</td>`}
   else total=`<td class="total-col"><button class="manual-score-button" aria-label="Totaalscore kiezen voor ${esc(row.name)}" onclick="openManualPicker('${r.id}',${row.i},event)">${r.manualScores?.[row.i]===undefined?'—':esc(r.manualScores[row.i])+'/'+r.maxScore}</button></td>`;
  }
  return `<tr><td><span class="student-name">${row.group?`<span class="group-dot" style="background:${row.group.color}" title="${esc(row.group.name)}"></span>`:''}${esc(row.name)}${row.groupRow?` <small>(${members.length})</small>`:''}</span></td>${cells}${total}</tr>`
 }).join('');
 $('evaluation').innerHTML=`<div class="tablewrap"><table class="eval-matrix"><thead><tr><th>${head}</th>${r.criteria.map((c,j)=>`<th class="criterion-col"><button title="${esc(c)} — alle leerlingen beoordelen" onclick="bulk('${r.id}',${j})">${esc(c)} ▾</button></th>`).join('')}${r.scoreMode!=='none'?'<th class="total-col">Totaalscore</th>':''}</tr></thead><tbody>${body}</tbody></table></div>`;
}

th+' geselecteerd'"><span>${esc(n)}</span>${other?`<small>Nu in ${esc(other.name)}</small>`:''}</label>`}).join('')}</div></div></div>`;el.classList.remove('hidden')}

function closeBulk(){const el=$('bulkModal');el.classList.add('hidden');el.innerHTML='';}
function bulk(id,j){
 const r=state.rubrics.find(x=>x.id===id);if(!r)return;
 const el=$('bulkModal');
 el.innerHTML=`<div class="bulk-backdrop" onclick="if(event.target===this)closeBulk()"><div class="bulk-dialog" role="dialog" aria-modal="true" aria-label="Alle leerlingen beoordelen"><div class="bulk-head"><div><h3>${esc(r.criteria[j])}</h3><p>Ken alle ${state.students.length} leerlingen hetzelfde niveau toe. Bestaande scores worden vervangen.</p></div><button aria-label="Sluiten" onclick="closeBulk()">×</button></div><div class="bulk-levels">${r.levels.map((l,n)=>`<button title="${esc(l)}" aria-label="${esc(l)}" onclick="applyBulk('${id}',${j},${n})">${r.scoreMode==='auto'?esc(r.pointValues?.[j]?.[n]??(r.levels.length-1-n)):r.levels.length-n}</button>`).join('')}</div></div></div>`;
 el.classList.remove('hidden');
}
function applyBulk(id,j,n){
 const before=state.students.map((_,i)=>{let k=key(id,i,j);return [k,Object.prototype.hasOwnProperty.call(state.scores,k),state.scores[k]]});
 state.students.forEach((_,i)=>state.scores[key(id,i,j)]=n);
 bulkUndo=before;closeBulk();renderEval();
 const bar=$('undoBar');bar.innerHTML=`<span>Score toegekend aan ${state.students.length} leerlingen</span><button onclick="undoBulk()">Ongedaan maken</button>`;bar.classList.remove('hidden');
 if(undoTimeout)clearTimeout(undoTimeout);undoTimeout=setTimeout(()=>{bar.classList.add('hidden');bulkUndo=null},8000);
}
function undoBulk(){if(!bulkUndo)return;for(const [k,exists,v] of bulkUndo){if(exists)state.scores[k]=v;else delete state.scores[k]}bulkUndo=null;$('undoBar').classList.add('hidden');if(undoTimeout)clearTimeout(undoTimeout);renderEval();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBulk()});
function exportResults(){
 if(!state.students.length||!state.rubrics.length)return toast('Geen resultaten om te exporteren');
 if(!checkXlsx())return;
 const headers=['Leerling'];
 state.rubrics.forEach(r=>{ensurePoints(r);r.criteria.forEach(c=>headers.push(r.name+' – '+c));if(r.scoreMode!=='none')headers.push(r.name+' – Totaalscore')});
 const rows=[headers];
 state.students.forEach((name,i)=>{const row=[name];state.rubrics.forEach(r=>{
  r.criteria.forEach((_,j)=>{const n=state.scores[key(r.id,i,j)];row.push(n===undefined?'':r.scoreMode==='auto'?Number(r.pointValues[j]?.[n])||0:r.levels.length-n)});
  if(r.scoreMode==='auto'){const v=totalScore(r,i);row.push(v==='—'?'':v+'/'+rubricMaximum(r))}
  else if(r.scoreMode==='manual')row.push(r.manualScores?.[i]===undefined?'':r.manualScores[i]+'/'+r.maxScore);
 });rows.push(row)});
 const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(rows);
 ws['!cols']=headers.map((h,i)=>({wch:i===0?27:Math.min(38,Math.max(17,h.length+2))}));
 XLSX.utils.book_append_sheet(wb,ws,'Resultaten');
 const name=(state.sessionName||'Evaluatiesessie').trim().replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,'-').slice(0,75)||'Evaluatiesessie';
 const date=/^\d{4}-\d{2}-\d{2}$/.test(state.date||'')?state.date:new Date().toISOString().slice(0,10);
 XLSX.writeFile(wb,`${date}_${name}_resultaten.xlsx`);toast('Resultaten geëxporteerd');
}
function exportSession(){if(!state.rubrics.length)return toast('Voeg eerst een rubric toe');if(!checkXlsx())return;let wb=XLSX.utils.book_new();function add(name,rows){XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name)}add('Sessie',[['LO_EVALUATIE_SESSIE','1'],['Naam',state.sessionName],['Datum',state.date],['ActieveRubric',state.activeRubric]]);add('Leerlingen',[['LeerlingIndex','Naam'],...state.students.map((s,i)=>[i,s])]);add('Rubrics',[['RubricID','Naam','NiveauIndex','Niveau','CriteriumIndex','Criterium','Beschrijving'],...state.rubrics.flatMap(r=>r.levels.flatMap((l,n)=>r.criteria.map((c,j)=>[r.id,r.name,n,l,j,c,r.descriptions[n]?.[j]||''])))]);add('Groepen',[['GroepID','Groepsnaam','Kleur'],...(state.groups||[]).map(g=>[g.id,g.name,g.color])]);add('Groepsindeling',[['LeerlingIndex','GroepID'],...Object.entries(state.studentGroups||{}).map(([i,id])=>[Number(i),id])]);add('Totaalscores',[['RubricID','Modus','CriteriumIndex','NiveauIndex','Punten','LeerlingIndex','HandmatigeScore','Maximumscore'],...state.rubrics.flatMap(r=>{ensurePoints(r);return [[r.id,r.scoreMode,'','','','','',r.maxScore],...r.pointValues.flatMap((a,j)=>a.map((v,n)=>[r.id,'',j,n,v,'',''])),...Object.entries(r.manualScores).map(([i,v])=>[r.id,'','','','',Number(i),v])]})]);add('Scores',[['RubricID','LeerlingIndex','CriteriumIndex','NiveauIndex'],...Object.entries(state.scores).map(([k,v])=>[...k.split('|').map((x,i)=>i?Number(x):x),v])]);const name=(state.sessionName||'Evaluatiesessie').trim().replace(/[\\/:*?"<>|]/g,'-').replace(/\s+/g,'-').replace(/^-+|-+$/g,'').slice(0,90)||'Evaluatiesessie';const date=/^\d{4}-\d{2}-\d{2}$/.test(state.date||'')?state.date:new Date().toISOString().slice(0,10);XLSX.writeFile(wb,`${date}_${name}.xlsx`);toast('Sessie geëxporteerd')}
async function importSession(e){if(!checkXlsx()||!e.target.files[0])return;try{let wb=await readExcel(e.target.files[0]);if(!['Sessie','Leerlingen','Rubrics','Scores'].every(n=>wb.SheetNames.includes(n)))throw Error('Dit is geen geldig sessiebestand');let rows=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});let meta=rows('Sessie');if(meta[0]?.[0]!=='LO_EVALUATIE_SESSIE')throw Error('Onbekend sessieformaat');let students=rows('Leerlingen').slice(1).map(x=>String(x[1]));let raw=rows('Rubrics').slice(1),map=new Map();for(let [id,name,ni,level,ci,criterion,description] of raw){if(!map.has(id))map.set(id,{id,name,criteria:[],levels:[],descriptions:[]});let r=map.get(id);r.criteria[ci]=criterion;r.levels[ni]=level;if(!r.descriptions[ni])r.descriptions[ni]=[];r.descriptions[ni][ci]=description}let rubrics=[...map.values()];if(wb.SheetNames.includes('Totaalscores'))for(const [id,mode,j,n,points,i,manual,maxScore] of rows('Totaalscores').slice(1)){let r=map.get(id);if(!r)continue;ensurePoints(r);if(['none','auto','manual'].includes(mode))r.scoreMode=mode;if(maxScore!==''&&Number.isInteger(Number(maxScore))&&Number(maxScore)>0)r.maxScore=Math.min(100,Number(maxScore));if(j!==''&&n!==''&&Number.isInteger(Number(j))&&Number.isInteger(Number(n))&&r.pointValues[Number(j)]&&Number(n)<r.levels.length)r.pointValues[Number(j)][Number(n)]=points===''?'':Number(points);if(i!==''&&Number.isInteger(Number(i))&&manual!=='')r.manualScores[Number(i)]=Number(manual)}if(!rubrics.length)throw Error('Geen rubrics in sessie');let scores={};for(let [id,i,j,n] of rows('Scores').slice(1)){if(!map.has(id)||!Number.isInteger(Number(i))||!Number.isInteger(Number(j))||!Number.isInteger(Number(n)))continue;scores[key(id,i,j)]=Number(n)}let groups=wb.SheetNames.includes('Groepen')?rows('Groepen').slice(1).filter(x=>x[0]).map(x=>({id:String(x[0]),name:String(x[1]||'Groep'),color:groupPalette.includes(String(x[2]))?String(x[2]):groupPalette[0]})):[];let studentGroups={};if(wb.SheetNames.includes('Groepsindeling'))for(let [i,id] of rows('Groepsindeling').slice(1)){if(Number.isInteger(Number(i))&&Number(i)>=0&&Number(i)<students.length&&groups.some(g=>g.id===String(id)))studentGroups[Number(i)]=String(id)}if(!confirm('Huidige sessie vervangen door dit bestand?'))return;editorRubricId=rubrics[0].id;state={rubrics,students,scores,groups,studentGroups,sessionName:String(meta[1]?.[1]||''),date:String(meta[2]?.[1]||''),activeRubric:map.has(meta[3]?.[1])?meta[3][1]:rubrics[0].id};renderAll();toast('Sessie hersteld')}catch(err){alert('Sessie niet ingeladen: '+err.message)}e.target.value=''}
renderAll();
</script><script>
function openRubricInfo(){
 const el=document.getElementById('rubricInfoModal');

 el.classList.remove('hidden');
}

</script></body></html>
